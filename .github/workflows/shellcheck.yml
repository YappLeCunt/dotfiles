name: shellcheck

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        run: |
          shellcheck --version
          shellcheck install.sh scripts/*.sh setup-*.sh home-linux/.local/bin/*.sh hardware/*.sh
          shellcheck hardware/disable-badcore-initramfs
