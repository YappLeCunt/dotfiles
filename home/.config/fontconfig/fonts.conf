<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- sans-serif resolution: Segoe UI first (Windows look), Inter as fallback.
       NOTE: Inter must use binding="weak" — with two strong prepends the
       system conf.d rules (56/60-latin) resolve Inter ahead of Segoe UI. -->
  <match target="pattern">
    <test name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Segoe UI</string>
    </edit>
    <edit name="family" mode="prepend" binding="weak">
      <string>Inter</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>Sans Serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Segoe UI</string>
    </edit>
    <edit name="family" mode="prepend" binding="weak">
      <string>Inter</string>
    </edit>
  </match>

  <!-- ClearType-style subpixel rendering for Segoe UI:
       embedded bytecode hinting (what Windows uses), not FreeType's autohinter -->
  <match target="font">
    <test name="family" compare="contains">
      <string>Segoe UI</string>
    </test>
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
  </match>
</fontconfig>
